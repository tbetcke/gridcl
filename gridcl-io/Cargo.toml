[package]
name = "gridcl-io"
description = "Gmsh and VTK input and output of gridcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[features]
# VTKHDF output (ADR-0035, rule 9).
hdf5 = ["dep:hdf5-metno", "dep:ndarray"]
# Collective VTKHDF writes through MPI-IO when `hdf5` is on too; needs a parallel HDF5
# (HDF5_DIR; ADR-0035, rule 9).
mpi = ["gridcl-parallel/mpi", "hdf5-metno?/mpio"]

[dependencies]
flate2.workspace = true
gridcl-device = { path = "../gridcl-device" }
gridcl-dims = { path = "../gridcl-dims" }
gridcl-geometry = { path = "../gridcl-geometry" }
gridcl-parallel = { path = "../gridcl-parallel" }
gridcl-partition = { path = "../gridcl-partition" }
gridcl-refcell = { path = "../gridcl-refcell" }
gridcl-topology = { path = "../gridcl-topology" }
hdf5-metno = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
# ThreadComm and the Python oracles of the VTKHDF tests (ADR-0035, rule 9).
gridcl-testing = { path = "../gridcl-testing" }
mshio.workspace = true
proptest.workspace = true
serde_json.workspace = true

# The test files are modules of one test executable (tests/main.rs): one link of the
# dependencies instead of one per file (disk space and link time).
[[test]]
name = "integration"
path = "tests/main.rs"
