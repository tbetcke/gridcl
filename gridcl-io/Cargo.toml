[package]
name = "gridcl-io"
description = "Gmsh and VTK input and output of gridcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# VTKHDF output; hdf5-metno is added in M8 T9 (ADR-0035, rule 9).
hdf5 = []
# Collective VTKHDF writes through MPI-IO when `hdf5` is on too (ADR-0035, rule 9).
mpi = ["gridcl-parallel/mpi"]

[dependencies]
flate2.workspace = true
gridcl-device = { path = "../gridcl-device" }
gridcl-dims = { path = "../gridcl-dims" }
gridcl-geometry = { path = "../gridcl-geometry" }
gridcl-parallel = { path = "../gridcl-parallel" }
gridcl-partition = { path = "../gridcl-partition" }
gridcl-refcell = { path = "../gridcl-refcell" }
gridcl-topology = { path = "../gridcl-topology" }

[dev-dependencies]
mshio.workspace = true
proptest.workspace = true
serde_json.workspace = true
