[package]
name = "env-check"
version = "0.1.0"
edition = "2024"
publish = false
description = "Probe of a gridcl development target: devices, properties, sample kernels, MPI; JSON report"
license = "MIT OR Apache-2.0"

# Outside the gridcl workspace (docs/design.md, "Workspace layout", dependency rule 6).
[workspace]

[features]
default = []
cpu = ["cubecl/cpu"]
metal = ["cubecl/metal"]
# CUDA through cubecl's default backend (LLVM -> PTX).
cuda = ["cubecl/cuda"]
# CUDA through the C++ backend compiled with NVRTC.
cuda-cpp = ["cuda", "cubecl/cuda-cpp"]
mpi = ["dep:mpi"]

[dependencies]
cubecl = "=0.11.0"
mpi = { version = "=0.8.2", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
