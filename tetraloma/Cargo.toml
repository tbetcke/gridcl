[package]
name = "tetraloma"
description = "Distributed unstructured meshes on GPUs and CPUs through CubeCL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[features]
# Library features, forwarded to the crates concerned (docs/design.md, "Cargo features").
# `dep:mpi` names `mpi::ffi::MPI_Comm` in the test communicator's `CommDyn::raw`.
mpi = ["tetraloma-parallel/mpi", "tetraloma-io/mpi", "dep:mpi"]
# The distributed partitioners need MPI (ADR-0029, item 4).
ptscotch = ["mpi", "tetraloma-partition/ptscotch"]
parmetis = ["mpi", "tetraloma-partition/parmetis"]
metis = ["tetraloma-partition/metis"]
scotch = ["tetraloma-partition/scotch"]
hdf5 = ["tetraloma-io/hdf5"]
gpu-aware-cuda = ["tetraloma-device/gpu-aware-cuda"]

[dependencies]
cubecl.workspace = true
tetraloma-device = { path = "../tetraloma-device" }
tetraloma-dims = { path = "../tetraloma-dims" }
tetraloma-geometry = { path = "../tetraloma-geometry" }
tetraloma-io = { path = "../tetraloma-io" }
tetraloma-parallel = { path = "../tetraloma-parallel" }
tetraloma-partition = { path = "../tetraloma-partition" }
tetraloma-refcell = { path = "../tetraloma-refcell" }
tetraloma-topology = { path = "../tetraloma-topology" }
log.workspace = true
mpi = { workspace = true, optional = true }

[dev-dependencies]
tetraloma-testing = { path = "../tetraloma-testing" }
proptest.workspace = true
# Exact float parsing: the oracles print f32 values that must compare bitwise.
serde_json = { workspace = true, features = ["float_roundtrip"] }
trybuild.workspace = true

# The test files are modules of one test executable (tests/main.rs): one link of the
# dependencies instead of one per file (disk space and link time).
[[test]]
name = "integration"
path = "tests/main.rs"
