[package]
name = "gridcl-geometry"
description = "Coordinate elements, quadrature and geometric factors of gridcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[features]
# Test support, not part of the stable API: the hidden `gridcl_geometry::testing` (strategy
# overrides; ADR-0042, item 3). gridcl-testing turns it on for every workspace test.
testing = []

[dependencies]
cubecl.workspace = true
gridcl-device = { path = "../gridcl-device" }
gridcl-dims = { path = "../gridcl-dims" }
gridcl-parallel = { path = "../gridcl-parallel" }
gridcl-refcell = { path = "../gridcl-refcell" }
gridcl-topology = { path = "../gridcl-topology" }

[dev-dependencies]
gridcl = { path = "../gridcl" }
gridcl-testing = { path = "../gridcl-testing" }

# The test files are modules of one test executable (tests/main.rs): one link of the
# dependencies instead of one per file (disk space and link time).
[[test]]
name = "integration"
path = "tests/main.rs"
