# Degree policy of gridcl-geometry (docs/design.md, "Geometric factors"; ADR-0042, item 3;
# ADR-0058).
#
# Per device class (Cpu or Gpu; ADR-0058) and kernel family, per cell type and scalar size in
# bytes: the strategy of each degree range, as [first degree, strategy] pairs with ascending
# first degrees, starting at 1; the last range is open-ended. Families: EVector, Points,
# Jacobian (J, det J and the pseudo-inverse), Normals (codimension 1: intervals, triangles and
# quadrilaterals), FacetNormals and PullBack (with the device basis evaluator). Strategies:
# direct, loops, sumfact, shared, cooperative. Interim values until M10 T10: [Cpu.*] holds the
# M9h CpuSimd128 ranges and [Gpu.*] the M9h Gpu ranges
# (gridcl-bench/history/degree-policy-pre-m10.toml). From T10, written by
# `cargo run -p gridcl-bench --bin high_order_report` from docs/perf/data/ with the generic
# decision rule of docs/perf/high-order.md; do not edit by hand.

[Cpu.EVector]
Interval = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Triangle = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Quadrilateral = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Tetrahedron = { 4 = [[1, "direct"], [5, "loops"]], 8 = [[1, "direct"], [5, "loops"]] }
Hexahedron = { 4 = [[1, "direct"], [5, "loops"]], 8 = [[1, "direct"], [7, "loops"]] }
Prism = { 4 = [[1, "direct"], [5, "loops"]], 8 = [[1, "direct"], [5, "loops"]] }
Pyramid = { 4 = [[1, "direct"], [4, "loops"]], 8 = [[1, "direct"], [4, "loops"]] }

[Cpu.Points]
Interval = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Triangle = { 4 = [[1, "direct"], [4, "loops"], [5, "direct"], [6, "loops"], [7, "direct"], [8, "loops"]], 8 = [[1, "direct"], [5, "loops"]] }
Quadrilateral = { 4 = [[1, "direct"], [2, "sumfact"]], 8 = [[1, "direct"], [2, "sumfact"]] }
Tetrahedron = { 4 = [[1, "direct"], [2, "loops"]], 8 = [[1, "direct"], [2, "loops"]] }
Hexahedron = { 4 = [[1, "sumfact"]], 8 = [[1, "sumfact"]] }
Prism = { 4 = [[1, "direct"], [2, "sumfact"]], 8 = [[1, "sumfact"]] }
Pyramid = { 4 = [[1, "direct"], [2, "loops"]], 8 = [[1, "direct"], [3, "loops"]] }

[Cpu.Jacobian]
Interval = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Triangle = { 4 = [[1, "direct"], [7, "loops"], [8, "direct"], [9, "loops"]], 8 = [[1, "direct"], [5, "loops"], [6, "direct"], [9, "loops"]] }
Quadrilateral = { 4 = [[1, "direct"], [3, "sumfact"]], 8 = [[1, "direct"], [3, "sumfact"]] }
Tetrahedron = { 4 = [[1, "direct"], [4, "loops"]], 8 = [[1, "direct"], [3, "loops"]] }
Hexahedron = { 4 = [[1, "direct"], [2, "sumfact"]], 8 = [[1, "direct"], [2, "sumfact"]] }
Prism = { 4 = [[1, "direct"], [2, "sumfact"]], 8 = [[1, "direct"], [2, "sumfact"]] }
Pyramid = { 4 = [[1, "direct"], [3, "loops"]], 8 = [[1, "direct"], [3, "loops"]] }

[Cpu.Normals]
Interval = { 4 = [[1, "direct"], [9, "loops"]], 8 = [[1, "direct"], [9, "loops"]] }
Triangle = { 4 = [[1, "direct"], [5, "loops"], [6, "direct"], [7, "loops"]], 8 = [[1, "direct"], [6, "loops"]] }
