[package]
name = "gridcl-testing"
description = "Test support for gridcl: the test device, test meshes, tolerances and the Python oracles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["cpu"]
# Runtime features, each the cubecl feature of the same name (docs/design.md, "Cargo features").
cpu = ["cubecl/cpu"]
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]
vulkan = ["cubecl/vulkan"]
metal = ["cubecl/metal"]
metal-native = ["cubecl/metal-native"]
wgpu = ["cubecl/wgpu"]
# ThreadComm implements `CommDyn::raw`, which exists only under gridcl-parallel's `mpi`: turn
# this on whenever gridcl's `mpi` is on (gridcl-mpi-tests does).
mpi = ["gridcl/mpi", "dep:mpi"]

[dependencies]
cubecl.workspace = true
gridcl = { path = "../gridcl" }
gridcl-device = { path = "../gridcl-device", features = ["testing"] }
gridcl-dims = { path = "../gridcl-dims" }
gridcl-refcell = { path = "../gridcl-refcell" }
mpi = { workspace = true, optional = true }
# Exact float parsing: the oracles print f32 values that must compare bitwise.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
proptest.workspace = true
