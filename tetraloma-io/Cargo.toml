[package]
name = "tetraloma-io"
description = "Gmsh and VTK input and output of tetraloma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[features]
# VTKHDF output (ADR-0035, rule 9).
hdf5 = ["dep:hdf5-metno", "dep:ndarray"]
# Collective VTKHDF writes through MPI-IO when `hdf5` is on too; needs a parallel HDF5
# (HDF5_DIR; ADR-0035, rule 9).
mpi = ["tetraloma-parallel/mpi", "hdf5-metno?/mpio"]

[dependencies]
flate2.workspace = true
tetraloma-device = { path = "../tetraloma-device" }
tetraloma-dims = { path = "../tetraloma-dims" }
tetraloma-geometry = { path = "../tetraloma-geometry" }
tetraloma-parallel = { path = "../tetraloma-parallel" }
tetraloma-partition = { path = "../tetraloma-partition" }
tetraloma-refcell = { path = "../tetraloma-refcell" }
tetraloma-topology = { path = "../tetraloma-topology" }
hdf5-metno = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
# ThreadComm and the Python oracles of the VTKHDF tests (ADR-0035, rule 9).
tetraloma-testing = { path = "../tetraloma-testing" }
mshio.workspace = true
proptest.workspace = true
serde_json.workspace = true

# The test files are modules of one test executable (tests/main.rs): one link of the
# dependencies instead of one per file (disk space and link time).
[[test]]
name = "integration"
path = "tests/main.rs"
