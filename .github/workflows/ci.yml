# Hosted CI jobs of docs/design.md, "CI matrix": cpu, mpi-mpich, mpi-openmpi and vulkan.
# The commands are the ones docs/dev-environment.md, "Test commands", records.
#
# Every push runs once; a pull request shows the checks of its head commit's push run, so there
# is no pull_request trigger (it ran every job twice). Caches hold dependencies only and are
# saved from main alone: branches restore main's caches instead of evicting them, since all
# workflows share 10 GB per repository.
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in test builds: it made up most of the cached target directory and of the
  # link time. Backtraces keep function names.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Workspace crates at opt-level 1 (dependencies are at 2, Cargo.toml): their host code
  # dominated the debug test times. Debug assertions and overflow checks stay on.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  # The CPU runtime's build script downloads its LLVM bundle to $XDG_DATA_HOME/tracel.
  XDG_DATA_HOME: /home/runner/.local/share

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt,clippy
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared with cpu-gridcl, which builds a subset and saves nothing.
          shared-key: cpu
          cache-directories: ~/.local/share/tracel
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `cargo test --workspace` in two jobs: gridcl's suite runs in cpu-gridcl.
      - run: cargo test --workspace --exclude gridcl
      # Partition-quality tests with vendored METIS, the design's CI default (M7 T3): only what
      # the feature changes; the rest of gridcl's suite ran above.
      - name: Partitioner tests with METIS
        run: |
          cargo test -p gridcl-partition --features metis
          cargo test -p gridcl --features metis --test integration partition_threads::
          cargo test -p gridcl --features metis --doc -- partitioner
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: scripts/check-workspace-deps.sh
      # Negative check: the script must still find MPI (exit 3) when a feature pulls it in.
      - run: |
          rc=0
          scripts/check-workspace-deps.sh --features gridcl-mpi-tests/mpi || rc=$?
          test "$rc" -eq 3

  # gridcl's tests, the larger half of `cargo test --workspace` (with the cpu job's), in the six
  # shards of scripts/ci-gridcl-shard.sh: in one job they took 52-59 min (M8 review).
  cpu-gridcl:
    name: cpu-gridcl-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cpu
          cache-directories: ~/.local/share/tracel
          save-if: false
      - name: Pinned Python oracles of the M5 VTK tests (ADR-0024)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check vtk==9.7.1 meshio==5.3.5
          .venv/bin/python scripts/oracles/vtk_oracle.py versions
      - run: scripts/ci-gridcl-shard.sh ${{ matrix.shard }}

  # Each MPI in two jobs: the MPI tests, and the hdf5 steps (together 25 min in one job, M8
  # review). The hdf5 jobs restore the mpi jobs' cache and save none.
  mpi:
    name: mpi-${{ matrix.mpi }}${{ matrix.part == 'hdf5' && '-hdf5' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mpi: [mpich, openmpi]
        part: [tests, hdf5]
        include:
          # bind: one hardware thread per rank. Each rank's CPU runtime starts one thread per
          # CPU it may use; unbound, 3-4 ranks oversubscribe the 4 vCPUs and exceed the time
          # limit (M6).
          - mpi: mpich
            packages: mpich libmpich-dev libhdf5-mpich-dev
            bind: -bind-to hwthread
          - mpi: openmpi
            packages: openmpi-bin libopenmpi-dev libhdf5-openmpi-dev
            bind: --use-hwthread-cpus --bind-to hwthread
    env:
      # Single node: some runner VMs expose an RDMA device that UCX picks but cannot use
      # (ibv_create_srq: Operation not supported), so MPI_Init fails.
      UCX_TLS: self,sm,tcp
      GRIDCL_MPIRUN_FLAGS: ${{ matrix.bind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MPI, its parallel HDF5 (M8 VTKHDF) and libclang (rsmpi's bindgen)
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.packages }} libclang-dev
      - run: mpirun --version
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mpi-${{ matrix.mpi }}
          cache-directories: ~/.local/share/tracel
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 'tests' }}
      - name: Pinned Python oracles of the VTK tests (ADR-0024, ADR-0035)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check vtk==9.7.1 meshio==5.3.5
          .venv/bin/python scripts/oracles/vtk_oracle.py versions
      - if: matrix.part == 'tests'
        run: cargo clippy -p gridcl-mpi-tests --features mpi --all-targets -- -D warnings
      - if: matrix.part == 'tests'
        run: scripts/mpi-test.sh 1 2 3 4
      # Feature hdf5 with Ubuntu's HDF5 1.10.10 (ADR-0035, rules 8-9): the gather path
      # (gridcl-io, ThreadComm) and the MPI-IO path (vtkhdf_parallel), read back by VTK.
      - name: HDF5_DIR for the parallel HDF5 of this MPI
        if: matrix.part == 'hdf5'
        run: |
          # hdf5-metno-sys looks for include/ and lib/ under HDF5_DIR; Ubuntu keeps the headers
          # and libraries of its MPI builds in separate trees.
          so=$(dpkg -L libhdf5-${{ matrix.mpi }}-dev | grep '/libhdf5\.so$' | head -n 1)
          test -n "$so"
          root=$RUNNER_TEMP/hdf5-${{ matrix.mpi }}
          mkdir -p "$root"
          ln -sfn /usr/include/hdf5/${{ matrix.mpi }} "$root/include"
          ln -sfn "$(dirname "$so")" "$root/lib"
          grep -E '^#define H5_(VERSION|HAVE_PARALLEL) ' "$root/include/H5pubconf.h"
          echo "HDF5_DIR=$root" >> "$GITHUB_ENV"
      - if: matrix.part == 'hdf5'
        run: cargo clippy -p gridcl-mpi-tests --features mpi,hdf5 --all-targets -- -D warnings
      - if: matrix.part == 'hdf5'
        run: cargo test -p gridcl-io --features hdf5
      - if: matrix.part == 'hdf5'
        run: cargo test -p gridcl --features hdf5 --test integration io_threads::vtkhdf
      - if: matrix.part == 'hdf5'
        run: cargo test -p gridcl --features hdf5 --doc vtkhdf
      - if: matrix.part == 'hdf5'
        run: scripts/mpi-test.sh 1 2 3 4
        env:
          GRIDCL_MPI_FEATURES: hdf5
          GRIDCL_MPI_TESTS: vtkhdf_parallel

  # In five jobs (33 min in one, M8 review): gridcl's shards of scripts/ci-gridcl-shard.sh, two
  # to a job where they are short, and the other crates, whose job saves the cache.
  vulkan:
    name: vulkan-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3,4", "5,6", other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software Vulkan (Mesa lavapipe)
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers vulkan-tools
      - run: vulkaninfo --summary
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: vulkan
          cache-directories: ~/.local/share/tracel
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'other' }}
      - name: Pinned Python oracles of the M5 VTK tests (ADR-0024)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check vtk==9.7.1 meshio==5.3.5
          .venv/bin/python scripts/oracles/vtk_oracle.py versions
      # Release build: the primitives' property tests are too slow on lavapipe in a debug
      # build (docs/plans/M2.md, question 15). It also runs the release-only mask tests.
      - if: matrix.shard != 'other'
        run: scripts/ci-gridcl-shard.sh ${{ matrix.shard }} --release --features gridcl-testing/vulkan
        env:
          GRIDCL_TEST_DEVICE: vulkan
      - if: matrix.shard == 'other'
        run: cargo test --release --workspace --exclude gridcl --features gridcl-testing/vulkan
        env:
          GRIDCL_TEST_DEVICE: vulkan
