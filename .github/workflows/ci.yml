# Throwaway probe (ADR-0068): does hosted CI's MPICH give real ranks with a workaround?
# Ubuntu 24.04's mpich 4.2.0-5build3 links PMIx, which its hydra launcher does not serve
# (Launchpad bug 2072338). This branch is deleted after the probe.
name: ci

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  XDG_DATA_HOME: /home/runner/.local/share
  UCX_TLS: self,sm,tcp

jobs:
  # Option 1: Ubuntu's MPICH with MPIR_CVAR_PMI_VERSION=1.
  pmi-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-install
        with:
          packages: mpich libmpich-dev libclang-dev
      - run: mpichversion | head -20
      - name: C program, plain and with MPIR_CVAR_PMI_VERSION=1
        run: |
          cat > hello.c <<'C'
          #include <mpi.h>
          #include <stdio.h>
          int main(void) {
            MPI_Init(NULL, NULL);
            int r, s;
            MPI_Comm_rank(MPI_COMM_WORLD, &r);
            MPI_Comm_size(MPI_COMM_WORLD, &s);
            printf("rank %d of %d\n", r, s);
            MPI_Finalize();
            return 0;
          }
          C
          mpicc hello.c -o hello
          echo "--- plain"; mpirun -n 4 ./hello || true
          echo "--- MPIR_CVAR_PMI_VERSION=1"; MPIR_CVAR_PMI_VERSION=1 mpirun -n 4 ./hello
          echo "--- -genv"; mpirun -genv MPIR_CVAR_PMI_VERSION 1 -n 4 ./hello
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mpi-mpich
          cache-directories: ~/.local/share/tracel
          save-if: false
      - name: tetraloma's MPI examples on 3 and 4 ranks with MPIR_CVAR_PMI_VERSION=1
        env:
          MPIR_CVAR_PMI_VERSION: 1
          TETRALOMA_EXAMPLES_PROFILE: debug
          TETRALOMA_MPIRUN_FLAGS: -bind-to hwthread
        run: |
          scripts/run-examples.sh --mpi --ranks 3
          scripts/run-examples.sh --mpi --ranks 4

  # Option 2: Debian's fixed 4.2.0-5.1 (built for Ubuntu 24.10) installed on 24.04.
  debian-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Install mpich 4.2.0-5.1 from Launchpad
        run: |
          mkdir debs && cd debs
          for p in libmpich12 libmpich-dev mpich; do
            curl -fsSLO "https://launchpad.net/ubuntu/+archive/primary/+files/${p}_4.2.0-5.1_amd64.deb"
          done
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ./*.deb
          mpichversion | head -20
      - name: C program, plain
        run: |
          cat > hello.c <<'C'
          #include <mpi.h>
          #include <stdio.h>
          int main(void) {
            MPI_Init(NULL, NULL);
            int r, s;
            MPI_Comm_rank(MPI_COMM_WORLD, &r);
            MPI_Comm_size(MPI_COMM_WORLD, &s);
            printf("rank %d of %d\n", r, s);
            MPI_Finalize();
            return 0;
          }
          C
          mpicc hello.c -o hello
          mpirun -n 4 ./hello
