# Partitioner tests with PT-Scotch (docs/design.md, "CI matrix"), on Ubuntu's PT-Scotch, ParMETIS
# and Open MPI. Nightly, on changes to gridcl-partition/, ptscotch-sys/ or parmetis-sys/, and by
# hand.
name: ptscotch

on:
  schedule:
    - cron: "43 2 * * *"
  push:
    paths:
      - "gridcl-partition/**"
      - "ptscotch-sys/**"
      - "parmetis-sys/**"
      - ".github/workflows/ptscotch.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ptscotch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PT-Scotch, ParMETIS, Open MPI and libclang (bindgen)
        uses: ./.github/actions/apt-install
        with:
          packages: libscotch-dev libptscotch-dev libmetis-dev libparmetis-dev openmpi-bin libopenmpi-dev libclang-dev
      - run: mpirun --version
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ptscotch
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p ptscotch-sys --features mpi
      - run: cargo test -p parmetis-sys --features mpi
      # ADR-0029, item 13: Ubuntu's PT-Scotch under MPI's Threading::Single on 2 ranks.
      - name: Threading probe, 2 ranks
        run: |
          cargo build -p ptscotch-sys --features mpi --example threading_probe
          timeout 300 mpirun --oversubscribe -n 2 target/debug/examples/threading_probe
      - run: cargo test -p gridcl-partition --features ptscotch
      # The M7 MPI targets in the two builds of ADR-0033: METIS (the acceptance run) and ParMETIS.
      # One hardware thread per rank, as in ci.yml's mpi jobs.
      - name: M7 MPI targets with METIS, 1-4 ranks
        run: scripts/mpi-test.sh 1 2 3 4
        env:
          GRIDCL_MPI_FEATURES: partitioners,metis
          GRIDCL_MPI_TESTS: partition_quality,partition_seed,partition_build
          UCX_TLS: self,sm,tcp
          GRIDCL_MPIRUN_FLAGS: --use-hwthread-cpus --bind-to hwthread
      - name: M7 MPI targets with ParMETIS, 1-4 ranks
        run: scripts/mpi-test.sh 1 2 3 4
        env:
          GRIDCL_MPI_FEATURES: partitioners,parmetis
          GRIDCL_MPI_TESTS: partition_quality,partition_seed,partition_build
          UCX_TLS: self,sm,tcp
          GRIDCL_MPIRUN_FLAGS: --use-hwthread-cpus --bind-to hwthread
