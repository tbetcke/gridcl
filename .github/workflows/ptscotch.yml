# Partitioner tests (docs/design.md, "CI matrix"; M7), on Ubuntu's Scotch, PT-Scotch, ParMETIS and
# Open MPI, in the two feature sets of ADR-0033. Nightly, on changes to gridcl-partition/,
# ptscotch-sys/, parmetis-sys/, the pipeline's dual graph, the M7 MPI targets or their test
# infrastructure, and by hand.
name: ptscotch

on:
  schedule:
    - cron: "43 2 * * *"
  push:
    paths:
      - "gridcl-partition/**"
      - "ptscotch-sys/**"
      - "parmetis-sys/**"
      - "gridcl/src/pipeline/dual_graph.rs"
      - "gridcl/src/builder.rs"
      - "gridcl-mpi-tests/**"
      - "gridcl-testing/src/partition.rs"
      - "gridcl-testing/src/meshes/boxes.rs"
      - "scripts/mpi-test.sh"
      - ".github/workflows/ptscotch.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # As ci.yml: workspace crates at opt-level 1, checks on.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1

jobs:
  # One job per feature set of ADR-0033 (METIS and ParMETIS exclude each other).
  ptscotch:
    name: ptscotch-${{ matrix.set }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: metis
            features: metis,scotch,ptscotch
          - set: parmetis
            features: scotch,ptscotch,parmetis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PT-Scotch, ParMETIS, Open MPI and libclang (bindgen)
        uses: ./.github/actions/apt-install
        with:
          packages: libscotch-dev libptscotch-dev libmetis-dev libparmetis-dev openmpi-bin libopenmpi-dev libclang-dev
      - run: mpirun --version
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ptscotch-${{ matrix.set }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p ptscotch-sys --features mpi
      - run: cargo test -p parmetis-sys --features mpi
      # ADR-0029, item 13: Ubuntu's PT-Scotch under MPI's Threading::Single on 2 ranks.
      - name: Threading probe, 2 ranks
        run: |
          cargo build -p ptscotch-sys --features mpi --example threading_probe
          timeout 300 mpirun --oversubscribe -n 2 target/debug/examples/threading_probe
      # gridcl's ptscotch and parmetis imply mpi, so ThreadComm needs gridcl-testing/mpi. Only
      # what the features change; ci.yml's cpu job runs the rest of gridcl's suite and the VTK
      # oracles (Python).
      - name: Partitioner tests
        run: |
          cargo test -p gridcl-partition --features "$FEATURES"
          cargo test -p gridcl --features "$FEATURES,gridcl-testing/mpi" --test partition_threads
          cargo test -p gridcl --features "$FEATURES,gridcl-testing/mpi" --doc -- partitioner
        env:
          FEATURES: ${{ matrix.features }}
          GRIDCL_SKIP_PYTHON: 1
      # The M7 MPI targets at 2 and 4 ranks: one rank runs in the ThreadComm tests, and the
      # acceptance runs at 4 and 8 ranks on Kathleen. One hardware thread per rank, as in
      # ci.yml's mpi jobs.
      - name: M7 MPI targets, 2 and 4 ranks
        run: scripts/mpi-test.sh 2 4
        env:
          GRIDCL_MPI_FEATURES: partitioners,${{ matrix.set }}
          GRIDCL_MPI_TESTS: partition_quality,partition_seed,partition_build
          UCX_TLS: self,sm,tcp
          GRIDCL_MPIRUN_FLAGS: --use-hwthread-cpus --bind-to hwthread
