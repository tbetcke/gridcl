# Partitioner tests with PT-Scotch (docs/design.md, "CI matrix"). A skeleton until M7.
# Nightly, on changes to gridcl-partition/ or ptscotch-sys/, and by hand.
name: ptscotch

on:
  schedule:
    - cron: "43 2 * * *"
  push:
    paths:
      - "gridcl-partition/**"
      - "ptscotch-sys/**"
      - ".github/workflows/ptscotch.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ptscotch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PT-Scotch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libptscotch-dev
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ptscotch-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ptscotch-
      - run: cargo test -p gridcl-partition --features ptscotch
