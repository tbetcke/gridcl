# gridcl-conformance against ndelement at the pinned commit (docs/design.md, A.10).
# Nightly, on changes to conformance/, gridcl-refcell/ or gridcl-dims/, and by hand.
name: conformance

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - "conformance/**"
      - "gridcl-refcell/**"
      - "gridcl-dims/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenBLAS
        run: |
          scripts/ci-apt-install.sh libopenblas-dev
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: conformance
          workspaces: conformance -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path conformance/Cargo.toml
      - name: Fixtures match a fresh export
        run: |
          cargo run --manifest-path conformance/Cargo.toml --bin export-fixtures
          git diff --exit-code gridcl-refcell/tests/fixtures
