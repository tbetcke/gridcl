[package]
name = "gridcl-examples"
description = "The examples of gridcl's API walkthrough, each over a tested run function"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["cpu"]
# Runtime features, as in gridcl-testing (docs/design.md, "Cargo features"; ADR-0060 item 6).
cpu = ["cubecl/cpu", "gridcl-testing/cpu"]
cuda = ["cubecl/cuda", "gridcl-testing/cuda"]
vulkan = ["cubecl/vulkan", "gridcl-testing/vulkan"]
metal = ["cubecl/metal", "gridcl-testing/metal"]
# The halo_exchange example under mpirun.
mpi = ["gridcl/mpi", "gridcl-testing/mpi", "dep:mpi"]

[dependencies]
cubecl.workspace = true
gridcl = { path = "../gridcl" }
gridcl-testing = { path = "../gridcl-testing", default-features = false }
mpi = { workspace = true, optional = true }

# The other examples are found by name; halo_exchange runs under mpirun.
[[example]]
name = "halo_exchange"
required-features = ["mpi"]
