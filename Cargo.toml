[workspace]
resolver = "3"
members = [
    "gridcl-dims",
    "gridcl-refcell",
    "gridcl-device",
    "gridcl-parallel",
    "gridcl-topology",
    "gridcl-geometry",
    "gridcl-partition",
    "gridcl-io",
    "gridcl",
    "ptscotch-sys",
    "parmetis-sys",
    "gridcl-testing",
    "gridcl-mpi-tests",
    "gridcl-bench",
]
# Outside the workspace (docs/design.md, "Workspace layout", dependency rule 6).
exclude = ["conformance", "tools/env-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cubecl = "=0.11.0"
cubecl-runtime = "=0.11.0"
mpi = { version = "=0.8.2", default-features = false }
proptest = "1"
serde_json = "1"
bytemuck = "1"
toml = "1"
libc = "0.2"
trybuild = "1"
# The test oracle of gridcl-io's Gmsh reader (ADR-0022).
mshio = "=0.4.2"
log = "0.4"
# zlib for VTU output, pure Rust (ADR-0024, item 10).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Partitioners (ADR-0029): METIS vendored by the metis crate; Scotch from the system library,
# with scotch-sys for the calls the scotch crate does not wrap.
metis = "=0.2.2"
scotch = "=0.2.1"
scotch-sys = "=0.2.1"
# scotch-sys's bindgen, with `runtime`: mpi-sys's bindgen turns on clang-sys's `runtime`, and
# scotch-sys's bindgen (default features off) then never loads libclang (docs/plans/M7.md,
# Deviations log, T0).
scotch-sys-bindgen = { package = "bindgen", version = "=0.65.1", default-features = false, features = ["runtime"] }
# Build dependencies of ptscotch-sys and parmetis-sys (feature `mpi`), the versions mpi-sys uses.
bindgen = "=0.72.1"
build-probe-mpi = "=0.1.6"

# buildid 1.0.5 (via cubecl-server's build_id_hash) adds dlpi_addr + p_vaddr, which wraps for
# some objects loaded on Myriad; with overflow checks the panic in its dl_iterate_phdr callback
# aborts the process (docs/plans/M0.md, Deviations log and Follow-ups). The release profile has no checks already.
[profile.dev.package.buildid]
overflow-checks = false

# gridcl-refcell's acceptance tests factor and apply 729 x 729 Vandermonde matrices (hexahedra,
# p = 8); unoptimised they take minutes (docs/plans/M1b.md, T7). Debug assertions and overflow
# checks stay on.
[profile.dev.package.gridcl-refcell]
opt-level = 3

# Dependencies (not workspace members) optimised in debug builds: the CPU runtime's kernel
# compilation and execution dominate debug test times (docs/plans/M3.md, question 20, step 2).
# Workspace crates keep opt-level 0, debug assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 2
