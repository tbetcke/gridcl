[package]
name = "gridcl-topology"
description = "Entity creation, ownership, connectivity and permutation info of gridcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Benchmark support, not a library feature: the hidden `gridcl_topology::bench` module.
# gridcl-bench turns it on (docs/design.md, "Cargo features"; ADR-0015).
bench = []

[dependencies]
cubecl.workspace = true
gridcl-device = { path = "../gridcl-device" }
gridcl-dims = { path = "../gridcl-dims" }
gridcl-parallel = { path = "../gridcl-parallel" }
gridcl-refcell = { path = "../gridcl-refcell" }

[dev-dependencies]
gridcl = { path = "../gridcl" }
gridcl-testing = { path = "../gridcl-testing" }
proptest.workspace = true
serde_json.workspace = true
