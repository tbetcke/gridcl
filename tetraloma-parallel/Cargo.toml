[package]
name = "tetraloma-parallel"
description = "Communicators, IndexMap, Scatterer and neighbourhood exchange of tetraloma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
mpi = ["dep:mpi"]

[dependencies]
bytemuck.workspace = true
tetraloma-device = { path = "../tetraloma-device" }
mpi = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
# The client and test meshes of the API examples, on hidden lines (ADR-0067, rule 6.3). With
# `mpi` on, its ThreadComm needs `tetraloma-testing/mpi` too.
tetraloma-testing = { path = "../tetraloma-testing" }
