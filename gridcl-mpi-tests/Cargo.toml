[package]
name = "gridcl-mpi-tests"
description = "MPI integration tests of gridcl, run by scripts/mpi-test.sh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The direct mpi dependency initialises MPI (`mpi::initialize`) and aborts the job on a panic.
mpi = ["gridcl/mpi", "gridcl-testing/mpi", "dep:mpi"]
# The M7 partitioner targets (scripts/mpi-test.sh: GRIDCL_MPI_FEATURES), with Scotch and PT-Scotch;
# add METIS (the acceptance run) or ParMETIS, never both (ADR-0033).
partitioners = ["gridcl/ptscotch", "gridcl/scotch"]
metis = ["gridcl/metis"]
parmetis = ["gridcl/parmetis"]

[dependencies]
gridcl = { path = "../gridcl" }
gridcl-testing = { path = "../gridcl-testing" }
mpi = { workspace = true, optional = true }

[[test]]
name = "allreduce_smoke"
harness = false
required-features = ["mpi"]

[[test]]
name = "comm"
harness = false
required-features = ["mpi"]

[[test]]
name = "parallel_invariance"
harness = false
required-features = ["mpi"]

[[test]]
name = "scatter"
harness = false
required-features = ["mpi"]

[[test]]
name = "determinism"
harness = false
required-features = ["mpi"]

[[test]]
name = "locality"
harness = false
required-features = ["mpi"]

[[test]]
name = "partition_quality"
harness = false
required-features = ["mpi", "partitioners"]

[[test]]
name = "partition_seed"
harness = false
required-features = ["mpi", "partitioners"]

[[test]]
name = "partition_build"
harness = false
required-features = ["mpi", "partitioners"]
