[package]
name = "gridcl-mpi-tests"
description = "MPI integration tests of gridcl, run by scripts/mpi-test.sh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The direct mpi dependency initialises MPI (`mpi::initialize`) and aborts the job on a panic.
mpi = ["gridcl/mpi", "gridcl-testing/mpi", "dep:mpi"]

[dependencies]
gridcl = { path = "../gridcl" }
gridcl-testing = { path = "../gridcl-testing" }
mpi = { workspace = true, optional = true }

[[test]]
name = "allreduce_smoke"
harness = false
required-features = ["mpi"]

[[test]]
name = "comm"
harness = false
required-features = ["mpi"]

[[test]]
name = "parallel_invariance"
harness = false
required-features = ["mpi"]

[[test]]
name = "scatter"
harness = false
required-features = ["mpi"]

[[test]]
name = "determinism"
harness = false
required-features = ["mpi"]

[[test]]
name = "locality"
harness = false
required-features = ["mpi"]
