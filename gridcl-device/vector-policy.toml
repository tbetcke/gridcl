# Vector policy of gridcl-device (docs/design.md, "Launch plans and the vector policy"; ADR-0015,
# ADR-0017).
#
# Per device class: the QuadField tile width by scalar size in bytes; the vector size per kernel
# family and scalar size; on CPU classes, the CPU block per kernel family and scalar size of the
# widest stream, in units of 4 KiB, and the CPU units (all hardware threads or the performance
# cores). Changed only with benchmark data in docs/perf/vectorization.md; until M3s every family
# runs at vector size 1 on all hardware threads, the tile width is 16 and every CPU block is
# 16 KiB.

[CpuSimd128]
quad_tile = { 4 = 16, 8 = 16 }
[CpuSimd128.vector_size]
Fill = { 4 = 1, 8 = 1 }
Copy = { 4 = 1, 8 = 1 }
Reduce = { 4 = 1, 8 = 1 }
ScanTile = { 4 = 1, 8 = 1 }
SortDigits = { 4 = 1, 8 = 1 }
Gather = { 4 = 1, 8 = 1 }
Pack = { 4 = 1, 8 = 1 }
TopologyKeys = { 4 = 1, 8 = 1 }
PermutationInfo = { 4 = 1, 8 = 1 }
EVector = { 4 = 1, 8 = 1 }
GeomFactors = { 4 = 1, 8 = 1 }
PullBack = { 4 = 1, 8 = 1 }
Scalar = { 4 = 1, 8 = 1 }
[CpuSimd128.cpu_block]
Fill = { 4 = 4, 8 = 4 }
Copy = { 4 = 4, 8 = 4 }
Reduce = { 4 = 4, 8 = 4 }
ScanTile = { 4 = 4, 8 = 4 }
SortDigits = { 4 = 4, 8 = 4 }
Gather = { 4 = 4, 8 = 4 }
Pack = { 4 = 4, 8 = 4 }
TopologyKeys = { 4 = 4, 8 = 4 }
