# Vector policy of gridcl-device (docs/design.md, "Launch plans and the vector policy"; ADR-0015,
# ADR-0058).
#
# Two device classes, Cpu and Gpu, each with one generic set per scalar size in bytes (4 and 8;
# ADR-0058): the QuadField tile width by scalar size; the vector size per kernel family and
# scalar size; on Cpu, the CPU block per kernel family and scalar size of the widest stream, in
# units of 4 KiB, and the CPU units (all hardware threads or the performance cores; ADR-0017).
# Interim values until M10 T8: [Cpu] holds the M3s CpuSimd128 entries and [Gpu] the M3s Gpu
# entries (gridcl-bench/history/vector-policy-pre-m10.toml). From T8, written by
# `cargo run -p gridcl-bench --bin policy_report` from docs/perf/data/ with the generic decision
# rule of docs/perf/vectorization.md; do not edit by hand.

[Cpu]
quad_tile = { 4 = 4, 8 = 4 }
[Cpu.vector_size]
Fill = { 4 = 16, 8 = 1 }
Copy = { 4 = 8, 8 = 1 }
Reduce = { 4 = 16, 8 = 1 }
ScanTile = { 4 = 16, 8 = 1 }
SortDigits = { 4 = 1, 8 = 1 }
Gather = { 4 = 1, 8 = 1 }
Pack = { 4 = 1, 8 = 1 }
TopologyKeys = { 4 = 1, 8 = 1 }
PermutationInfo = { 4 = 1, 8 = 1 }
EVector = { 4 = 16, 8 = 8 }
GeomFactors = { 4 = 4, 8 = 4 }
PullBack = { 4 = 1, 8 = 1 }
Scalar = { 4 = 1, 8 = 1 }
[Cpu.cpu_block]
Fill = { 4 = 16, 8 = 16 }
Copy = { 4 = 16, 8 = 4 }
Reduce = { 4 = 16, 8 = 16 }
ScanTile = { 4 = 16, 8 = 4 }
SortDigits = { 4 = 16, 8 = 4 }
Gather = { 4 = 16, 8 = 16 }
Pack = { 4 = 4, 8 = 4 }
TopologyKeys = { 4 = 16, 8 = 4 }
PermutationInfo = { 4 = 16, 8 = 4 }
EVector = { 4 = 16, 8 = 4 }
GeomFactors = { 4 = 1, 8 = 16 }
PullBack = { 4 = 4, 8 = 4 }
Scalar = { 4 = 16, 8 = 1 }
[Cpu.cpu_units]
Fill = { 4 = "performance", 8 = "all" }
Copy = { 4 = "all", 8 = "all" }
Reduce = { 4 = "performance", 8 = "performance" }
ScanTile = { 4 = "performance", 8 = "all" }
SortDigits = { 4 = "performance", 8 = "all" }
Gather = { 4 = "performance", 8 = "performance" }
Pack = { 4 = "all", 8 = "all" }
TopologyKeys = { 4 = "performance", 8 = "all" }
PermutationInfo = { 4 = "performance", 8 = "all" }
EVector = { 4 = "all", 8 = "performance" }
GeomFactors = { 4 = "all", 8 = "all" }
PullBack = { 4 = "all", 8 = "all" }
Scalar = { 4 = "performance", 8 = "performance" }

[Gpu]
quad_tile = { 4 = 16, 8 = 16 }
[Gpu.vector_size]
Fill = { 4 = 1, 8 = 1 }
Copy = { 4 = 4, 8 = 1 }
Reduce = { 4 = 16, 8 = 4 }
ScanTile = { 4 = 8, 8 = 1 }
SortDigits = { 4 = 4, 8 = 1 }
Gather = { 4 = 1, 8 = 1 }
Pack = { 4 = 1, 8 = 1 }
TopologyKeys = { 4 = 1, 8 = 1 }
PermutationInfo = { 4 = 1, 8 = 1 }
EVector = { 4 = 1, 8 = 1 }
GeomFactors = { 4 = 1, 8 = 1 }
PullBack = { 4 = 1, 8 = 1 }
Scalar = { 4 = 1, 8 = 1 }
