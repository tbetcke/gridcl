[package]
name = "gridcl-device"
description = "Device buffers, limits, launch plans and primitives of gridcl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# GPU-aware MPI on CUDA: device pointers of CUDA buffers. The one library feature that enables
# a cubecl runtime (docs/design.md, "Dependency rules" 4).
gpu-aware-cuda = ["cubecl/cuda", "dep:cubecl-runtime"]
# Test support, not part of the stable API: the scoped overrides of `gridcl_device::testing`.
# gridcl-testing turns it on for every workspace test (docs/design.md, "Cargo features").
testing = []

[dependencies]
cubecl.workspace = true
cubecl-runtime = { workspace = true, optional = true }
toml.workspace = true

# The macOS performance-core count (`sysctlbyname`, ADR-0017).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
gridcl-testing = { path = "../gridcl-testing" }
proptest.workspace = true
