[package]
name = "tetraloma-examples"
description = "The example programs of tetraloma's API walkthrough and user book, each over a tested run function"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["cpu"]
# Runtime features, as in tetraloma-testing (docs/design.md, "Cargo features"; ADR-0060 item 6).
cpu = ["cubecl/cpu", "tetraloma-testing/cpu"]
cuda = ["cubecl/cuda", "tetraloma-testing/cuda"]
vulkan = ["cubecl/vulkan", "tetraloma-testing/vulkan"]
metal = ["cubecl/metal", "tetraloma-testing/metal"]
# The MPI examples (halo_exchange, distributed_mesh, parallel_io) under mpirun.
mpi = ["tetraloma/mpi", "tetraloma-testing/mpi", "dep:mpi"]
# The VTKHDF part of parallel_io (ADR-0067).
hdf5 = ["tetraloma/hdf5"]

[dependencies]
cubecl.workspace = true
tetraloma = { path = "../tetraloma" }
# The tables of the book's figures (figures.rs; ADR-0067, rule 3).
tetraloma-refcell = { path = "../tetraloma-refcell" }
tetraloma-testing = { path = "../tetraloma-testing", default-features = false }
mpi = { workspace = true, optional = true }

# Writes the book's figures to docs/user/src/figures/.
[[bin]]
name = "figures"
path = "src/bin/figures.rs"

# The serial examples are found by name; the MPI examples run under mpirun.
[[example]]
name = "halo_exchange"
required-features = ["mpi"]

[[example]]
name = "distributed_mesh"
required-features = ["mpi"]

[[example]]
name = "parallel_io"
required-features = ["mpi"]
